name: rive
version: 0.15.0-dev.4
homepage: https://rive.app
description: Flutter runtime for Rive, the agent-native 2D and 3D engine for games, apps, and interactive UI. Plays Rive files (.riv) natively in Flutter apps and games.
repository: https://github.com/rive-app/rive-flutter
topics:
  - animation
  - ui
  - effects
  - design
  - games

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  rive_native: 0.2.0-dev.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
